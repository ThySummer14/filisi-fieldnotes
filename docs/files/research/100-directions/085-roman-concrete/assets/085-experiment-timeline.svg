<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-label="自愈实验按顺序经历28天养护、制造裂缝和通水验证、两个月干湿预处理、30天流水观察。各框宽度不代表时间长度。"><rect width="1000" height="360" fill="#faf8f2"/><g font-family="sans-serif" fill="#173b48"><text x="38" y="49" font-size="24">裂缝流水试验：时间从浇筑开始算</text><g fill="#e6eee9" stroke="#668e7f" stroke-width="2"><rect x="35" y="100" width="195" height="128" rx="8"/><rect x="278" y="100" width="195" height="128" rx="8"/><rect x="521" y="100" width="195" height="128" rx="8"/><rect x="764" y="100" width="195" height="128" rx="8"/></g><g font-size="22" text-anchor="middle"><text x="132" y="145">28天</text><text x="132" y="185">水下养护</text><text x="375" y="142">劈开与重合</text><text x="375" y="177">留0.5±0.1毫米缝</text><text x="375" y="208" font-size="18">通水验证稳定性</text><text x="618" y="145">两个月</text><text x="618" y="185">干湿循环预处理</text><text x="861" y="145">30天</text><text x="861" y="185">持续供水观察</text></g><g font-size="28"><text x="241" y="172">→</text><text x="484" y="172">→</text><text x="727" y="172">→</text></g><text x="38" y="277" font-size="19">含石灰团块试件与无团块对照；随后检查裂面及填缝矿物</text><text x="38" y="315" font-size="17" fill="#5a6a66">按Seymour等（2023）方法绘制，非论文原图；框宽不代表时长。</text></g></svg>
