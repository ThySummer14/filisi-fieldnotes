<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="480" viewBox="0 0 1120 480" role="img" aria-label="三个实地同样大小的小方块，在赤道、60度和80度纬度处按墨卡托局部尺度放大"><rect width="1120" height="480" fill="#faf8f2"/><g font-family="Noto Sans CJK SC,sans-serif" fill="#263f48"><text x="38" y="43" font-size="26">同样大小的一小块地，搬到高纬后画得多大</text><text x="38" y="77" font-size="17">球面近似，赤道尺度设为1；方块代表实地相等且足够小的面积，不是同样经纬跨度</text><rect x="160.00" y="295.00" width="40.00" height="40.00" fill="#bcdedc" stroke="#287e84" stroke-width="2"/><text x="180" y="372" font-size="21" text-anchor="middle">纬度 0°</text><text x="180" y="405" font-size="18" text-anchor="middle">边长 ×1.00　面积 ×1.00</text><rect x="450.00" y="255.00" width="80.00" height="80.00" fill="#bcdedc" stroke="#287e84" stroke-width="2"/><text x="490" y="372" font-size="21" text-anchor="middle">纬度 60°</text><text x="490" y="405" font-size="18" text-anchor="middle">边长 ×2.00　面积 ×4.00</text><rect x="754.82" y="104.65" width="230.35" height="230.35" fill="#bcdedc" stroke="#287e84" stroke-width="2"/><text x="870" y="372" font-size="21" text-anchor="middle">纬度 80°</text><text x="870" y="405" font-size="18" text-anchor="middle">边长 ×5.76　面积 ×33.16</text><text x="38" y="457" font-size="17" fill="#62767c">60°处横向、纵向都放大2倍，面积便是4倍。尺度沿纬度连续改变，不能直接套给整片大陆。</text></g></svg>