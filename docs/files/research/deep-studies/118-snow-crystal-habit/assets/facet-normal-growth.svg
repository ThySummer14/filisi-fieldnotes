<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="745" viewBox="0 0 1200 745">
<rect width="100%" height="100%" fill="#fbfcfe"/>
<style>text{font-family:'Noto Sans CJK SC',sans-serif;fill:#172938} .muted{fill:#526676} .small{font-size:19px} .body{font-size:23px}</style>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="context-stroke"/></marker></defs><text x="55" y="62" font-size="32" fill="#172938" text-anchor="start">看法向推进速度，别把大晶面当成快晶面</text><text x="55" y="100" font-size="21" fill="#172938" text-anchor="start">纵剖面示意：水平边对应基面，竖直边对应一对相对的棱柱面</text><text x="320" y="163" font-size="24" fill="#172938" text-anchor="middle">棱柱面向外推进快 → 薄片</text><rect x="145.0" y="335.0" width="350" height="60" fill="#dfebf3"/><path d="M145.0,335.0h350 M145.0,395.0h350" stroke="#a65224" stroke-width="5"/><path d="M145.0,335.0v60 M495.0,335.0v60" stroke="#236c94" stroke-width="5"/><path d="M320,335.0 L320,312.0" stroke="#a65224" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M320,395.0 L320,418.0" stroke="#a65224" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M145.0,365 L77.0,365" stroke="#236c94" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M495.0,365 L563.0,365" stroke="#236c94" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="320" y="579" font-size="23" fill="#172938" text-anchor="middle">厚度 H 的增速 = 2 v基</text><text x="320" y="616" font-size="23" fill="#172938" text-anchor="middle">对边宽 W 的增速 = 2 v棱</text><text x="875" y="163" font-size="24" fill="#172938" text-anchor="middle">基面向两端推进快 → 细柱</text><rect x="830.0" y="260.0" width="90" height="210" fill="#dfebf3"/><path d="M830.0,260.0h90 M830.0,470.0h90" stroke="#a65224" stroke-width="5"/><path d="M830.0,260.0v210 M920.0,260.0v210" stroke="#236c94" stroke-width="5"/><path d="M875,260.0 L875,204.0" stroke="#a65224" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M875,470.0 L875,526.0" stroke="#a65224" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M830.0,365 L806.0,365" stroke="#236c94" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M920.0,365 L944.0,365" stroke="#236c94" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="875" y="579" font-size="23" fill="#172938" text-anchor="middle">厚度 H 的增速 = 2 v基</text><text x="875" y="616" font-size="23" fill="#172938" text-anchor="middle">对边宽 W 的增速 = 2 v棱</text><text x="55" y="676" font-size="21" fill="#172938" text-anchor="start">橙色：两个基面，法向沿 c 轴。蓝色：六个棱柱面，法向在横向。</text><text x="55" y="713" font-size="19" fill="#172938" text-anchor="start">箭头表示增长方向；长度仅作快慢示意。晶面的外露面积不等于其法向生长速度。</text></svg>