<svg xmlns="http://www.w3.org/2000/svg" width="1030" height="440" viewBox="0 0 1030 440" role="img" aria-label="托勒密第1、3、4个符号分别与克娄巴特拉第5、4、2个符号对应P、O、L"><rect width="1030" height="440" fill="#faf8f2"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#213d49"><text x="35" y="42" font-size="25">同一个声音线索，出现在两个名字的不同位置</text><text x="35" y="77" font-size="17">按1822年原信的历史分析绘制；卡片只表示位置，不模仿原字形</text><line x1="234" y1="178" x2="754" y2="260" stroke="#ab5d36" stroke-width="3"/><line x1="494" y1="178" x2="624" y2="260" stroke="#287f87" stroke-width="3"/><line x1="624" y1="178" x2="364" y2="260" stroke="#7560a6" stroke-width="3"/><text x="35" y="156" font-size="20">托勒密</text><rect x="185" y="116" width="98" height="62" rx="7" fill="#fffdf8" stroke="#ab5d36" stroke-width="2"/><text x="234" y="139" text-anchor="middle" font-size="14">第1个</text><text x="234" y="165" text-anchor="middle" font-size="22" fill="#ab5d36">P</text><rect x="315" y="116" width="98" height="62" rx="7" fill="#fffdf8" stroke="#758286" stroke-width="2"/><text x="364" y="139" text-anchor="middle" font-size="14">第2个</text><text x="364" y="165" text-anchor="middle" font-size="22" fill="#758286">·</text><rect x="445" y="116" width="98" height="62" rx="7" fill="#fffdf8" stroke="#287f87" stroke-width="2"/><text x="494" y="139" text-anchor="middle" font-size="14">第3个</text><text x="494" y="165" text-anchor="middle" font-size="22" fill="#287f87">O</text><rect x="575" y="116" width="98" height="62" rx="7" fill="#fffdf8" stroke="#7560a6" stroke-width="2"/><text x="624" y="139" text-anchor="middle" font-size="14">第4个</text><text x="624" y="165" text-anchor="middle" font-size="22" fill="#7560a6">L</text><rect x="705" y="116" width="98" height="62" rx="7" fill="#fffdf8" stroke="#758286" stroke-width="2"/><text x="754" y="139" text-anchor="middle" font-size="14">第5个</text><text x="754" y="165" text-anchor="middle" font-size="22" fill="#758286">…</text><rect x="835" y="116" width="98" height="62" rx="7" fill="#fffdf8" stroke="#758286" stroke-width="2"/><text x="884" y="139" text-anchor="middle" font-size="14">后续</text><text x="884" y="165" text-anchor="middle" font-size="22" fill="#758286">…</text><text x="35" y="300" font-size="20">克娄巴特拉</text><rect x="185" y="260" width="98" height="62" rx="7" fill="#fffdf8" stroke="#758286" stroke-width="2"/><text x="234" y="283" text-anchor="middle" font-size="14">第1个</text><text x="234" y="309" text-anchor="middle" font-size="22" fill="#758286">·</text><rect x="315" y="260" width="98" height="62" rx="7" fill="#fffdf8" stroke="#7560a6" stroke-width="2"/><text x="364" y="283" text-anchor="middle" font-size="14">第2个</text><text x="364" y="309" text-anchor="middle" font-size="22" fill="#7560a6">L</text><rect x="445" y="260" width="98" height="62" rx="7" fill="#fffdf8" stroke="#758286" stroke-width="2"/><text x="494" y="283" text-anchor="middle" font-size="14">第3个</text><text x="494" y="309" text-anchor="middle" font-size="22" fill="#758286">·</text><rect x="575" y="260" width="98" height="62" rx="7" fill="#fffdf8" stroke="#287f87" stroke-width="2"/><text x="624" y="283" text-anchor="middle" font-size="14">第4个</text><text x="624" y="309" text-anchor="middle" font-size="22" fill="#287f87">O</text><rect x="705" y="260" width="98" height="62" rx="7" fill="#fffdf8" stroke="#ab5d36" stroke-width="2"/><text x="754" y="283" text-anchor="middle" font-size="14">第5个</text><text x="754" y="309" text-anchor="middle" font-size="22" fill="#ab5d36">P</text><rect x="835" y="260" width="98" height="62" rx="7" fill="#fffdf8" stroke="#758286" stroke-width="2"/><text x="884" y="283" text-anchor="middle" font-size="14">后续</text><text x="884" y="309" text-anchor="middle" font-size="22" fill="#758286">…</text><text x="35" y="371" font-size="18">P：1 ↔ 5　　O：3 ↔ 4　　L：4 ↔ 2</text><text x="35" y="409" font-size="16" fill="#617275">仅显示三组比较；点号省略未展开的符号。不是完整拼写，也不是现代音值表。</text></g></svg>