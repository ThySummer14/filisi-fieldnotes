<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="455" viewBox="0 0 1040 455" role="img" aria-label="目标星98份光不变，背景食双星从2份变1份，混合亮度由100下降到99"><rect width="1040" height="455" fill="#faf8f2"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#213d49"><text x="40" y="47" font-size="26">同样下降1%，变暗的可以是旁边的星</text><text x="40" y="80" font-size="17">原创混光算例；位置用像素作单位，圆的大小不代表真实半径</text><rect x="40" y="111" width="445" height="210" rx="12" fill="#e5edf1"/><rect x="550" y="111" width="445" height="210" rx="12" fill="#f1e9df"/><text x="62" y="149" font-size="22">食发生前：98 + 2 = 100份光</text><text x="572" y="149" font-size="22">食发生时：98 + 1 = 99份光</text><circle cx="128" cy="216" r="32" fill="#e6b757"/><circle cx="371" cy="216" r="15" fill="#648397"/><circle cx="638" cy="216" r="32" fill="#e6b757"/><circle cx="881" cy="216" r="15" fill="#a6b5bf"/><text x="87" y="270" font-size="17">目标：98</text><text x="337" y="270" font-size="17">背景：2</text><text x="597" y="270" font-size="17">目标：98</text><text x="847" y="270" font-size="17">背景：1</text><text x="73" y="300" font-size="16">位置0</text><text x="348" y="300" font-size="16">位置4</text><text x="583" y="300" font-size="16">位置0</text><text x="858" y="300" font-size="16">位置4</text><text x="40" y="364" font-size="21">亮度重心：0.08 → 0.0404，向不变的目标星移动约0.0396像素</text><text x="40" y="403" font-size="18">差分图像再问：究竟是哪个位置少了光？</text><text x="40" y="436" font-size="16" fill="#617275">总光深度相同，像素分布不同；能否测到位移仍取决于噪声与仪器。</text></g></svg>