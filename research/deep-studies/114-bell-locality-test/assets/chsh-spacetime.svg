<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="900" viewBox="0 0 1180 900" role="img"><title>1280米间距下的选设置、读出及真空光速传播时间预算</title>
<rect width="100%" height="100%" fill="#f7f4ee"/>
<g font-family="Noto Sans CJK SC, sans-serif">
<text x="50" y="60" font-size="32" fill="#17333d" text-anchor="start" font-weight="700">读出结束时，对面的光速消息还没赶到</text>
<text x="50" y="103" font-size="21" fill="#17333d" text-anchor="start" font-weight="400">简化重画甲乙时间预算：两端起点对齐；不包含C站，不是原始事件时间戳。</text>
<line x1="170" y1="690" x2="880" y2="690" stroke="#d8dfde" stroke-width="1"/>
<text x="148" y="697" font-size="20" fill="#17333d" text-anchor="end" font-weight="400">0</text>
<line x1="170" y1="580" x2="880" y2="580" stroke="#d8dfde" stroke-width="1"/>
<text x="148" y="587" font-size="20" fill="#17333d" text-anchor="end" font-weight="400">1</text>
<line x1="170" y1="470" x2="880" y2="470" stroke="#d8dfde" stroke-width="1"/>
<text x="148" y="477" font-size="20" fill="#17333d" text-anchor="end" font-weight="400">2</text>
<line x1="170" y1="360" x2="880" y2="360" stroke="#d8dfde" stroke-width="1"/>
<text x="148" y="367" font-size="20" fill="#17333d" text-anchor="end" font-weight="400">3</text>
<line x1="170" y1="250" x2="880" y2="250" stroke="#d8dfde" stroke-width="1"/>
<text x="148" y="257" font-size="20" fill="#17333d" text-anchor="end" font-weight="400">4</text>
<line x1="170" y1="140" x2="880" y2="140" stroke="#d8dfde" stroke-width="1"/>
<text x="148" y="147" font-size="20" fill="#17333d" text-anchor="end" font-weight="400">5</text>
<text x="80" y="140" font-size="21" fill="#17333d" text-anchor="start" font-weight="400">时间</text>
<text x="80" y="168" font-size="18" fill="#17333d" text-anchor="start" font-weight="400">微秒</text>
<line x1="170" y1="140" x2="170" y2="690" stroke="#48616b" stroke-width="2"/>
<line x1="170" y1="690" x2="880" y2="690" stroke="#48616b" stroke-width="2"/>
<line x1="220" y1="140" x2="220" y2="690" stroke="#bbceca" stroke-width="2"/>
<line x1="220" y1="637.2" x2="220" y2="690" stroke="#d18932" stroke-width="15"/>
<line x1="220" y1="230.20000000000005" x2="220" y2="637.2" stroke="#176a61" stroke-width="15"/>
<circle cx="220" cy="230.20000000000005" r="6" fill="#17333d"/>
<text x="220" y="732" font-size="23" fill="#17333d" text-anchor="middle" font-weight="700">甲：0米</text>
<line x1="860" y1="140" x2="860" y2="690" stroke="#bbceca" stroke-width="2"/>
<line x1="860" y1="637.2" x2="860" y2="690" stroke="#d18932" stroke-width="15"/>
<line x1="860" y1="230.20000000000005" x2="860" y2="637.2" stroke="#176a61" stroke-width="15"/>
<circle cx="860" cy="230.20000000000005" r="6" fill="#17333d"/>
<text x="860" y="732" font-size="23" fill="#17333d" text-anchor="middle" font-weight="700">乙：1280米</text>
<line x1="220" y1="690" x2="860" y2="220.34175396100187" stroke="#ab623d" stroke-width="3" stroke-dasharray="8 6"/>
<circle cx="860" cy="220.34175396100187" r="5" fill="#ab623d"/>
<line x1="860" y1="690" x2="220" y2="220.34175396100187" stroke="#ab623d" stroke-width="3" stroke-dasharray="8 6"/>
<circle cx="220" cy="220.34175396100187" r="5" fill="#ab623d"/>
<text x="535" y="401" font-size="21" fill="#8e4b2a" text-anchor="middle" font-weight="400">光速信号</text>
<text x="270" y="450" font-size="21" fill="#176a61" text-anchor="start" font-weight="400">读出：3.7微秒</text>
<text x="340" y="663" font-size="19" fill="#8b5a1f" text-anchor="start" font-weight="400">选设置、切换及旋转：0.48微秒</text>
<polyline points="860,220.34175396100187 897,190 915,190" fill="none" stroke="#ab623d" stroke-width="1.5"/>
<text x="925" y="185" font-size="19" fill="#8e4b2a" text-anchor="start" font-weight="400">光到达</text>
<text x="925" y="213" font-size="20" fill="#8e4b2a" text-anchor="start" font-weight="400">≈4.270微秒</text>
<polyline points="860,230.20000000000005 897,275 915,275" fill="none" stroke="#176a61" stroke-width="1.5"/>
<text x="925" y="270" font-size="19" fill="#176a61" text-anchor="start" font-weight="400">读出结束</text>
<text x="925" y="298" font-size="20" fill="#176a61" text-anchor="start" font-weight="400">4.180微秒</text>
<text x="925" y="353" font-size="21" fill="#17333d" text-anchor="start" font-weight="700">差约90纳秒</text>
<text x="50" y="804" font-size="21" fill="#17333d" text-anchor="start" font-weight="400">横纵坐标均线性。斜线斜率来自真空光速299,792,458米/秒。</text>
<text x="50" y="844" font-size="19" fill="#17333d" text-anchor="start" font-weight="400">数据：Hensen等（2015）图2及正文；距离为论文取整值，不以本图另作时序校准。</text>
</g></svg>