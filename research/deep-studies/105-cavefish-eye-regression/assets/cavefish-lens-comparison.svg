<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="440" viewBox="0 0 1040 440" role="img" aria-label="同一洞穴鱼胚胎单侧晶状体移植实验的比较与测量终点"><rect width="1040" height="440" fill="#faf8f2"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#213d49"><text x="40" y="48" font-size="26">同一条鱼，保留一侧作比较</text><text x="40" y="83" font-size="18">受精后30至36小时操作；随后追踪眼组织</text><rect x="40" y="117" width="445" height="205" rx="12" fill="#e2eeeb"/><rect x="550" y="117" width="445" height="205" rx="12" fill="#f5e9de"/><text x="64" y="160" font-size="23">一侧：移入地表型晶状体</text><text x="64" y="208" font-size="19">视网膜细胞死亡受到抑制</text><text x="64" y="245" font-size="19">组织增长，杆状感光细胞分化</text><text x="574" y="160" font-size="23">另一侧：不移植</text><text x="574" y="208" font-size="19">作为同一条鱼的内部对照</text><text x="574" y="245" font-size="19">眼组织继续退化</text><text x="64" y="290" font-size="17" fill="#506565">改变的是局部组织条件</text><text x="574" y="290" font-size="17" fill="#685d55">未接受相同假手术，控制并非穷尽</text><text x="40" y="368" font-size="19">测到组织存活与分化，不等于测到完整视觉恢复。</text><text x="40" y="406" font-size="16" fill="#617275">据Strickler等（2007）方法与结果重画；示意图，不是论文图像或新增实验。</text></g></svg>