<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-label="两区运输教学模型：表层只有总容量的20%；表层达到模型上限时，整片平均仍可能较低"><rect width="1120" height="620" fill="#faf8f2"/><g font-family="Noto Sans CJK SC,sans-serif" fill="#263e48"><text x="38" y="44" font-size="26">表层先达到上限，不等于整体已经装满</text><text x="38" y="79" font-size="17">原创两区模型：表层占总容量20%，内部占80%；只改变两区间的转移速度</text><text x="40" y="135" font-size="21">内部转移慢</text><rect x="210" y="113" width="150" height="125" fill="#cd834a"/><text x="285" y="161" font-size="18" text-anchor="middle">表层</text><text x="285" y="197" font-size="24" text-anchor="middle">100%</text><rect x="380" y="113" width="600" height="125" fill="#e8eeeb" stroke="#9bacac"/><rect x="380" y="229.87" width="600" height="8.13" fill="#acd7d5"/><text x="680" y="161" font-size="18" text-anchor="middle">内部</text><text x="680" y="197" font-size="24" text-anchor="middle">6.5%</text><text x="210" y="276" font-size="19">整体平均 = 20% × 100% + 80% × 6.5% = 25.2%</text><text x="40" y="340" font-size="21">内部转移快</text><rect x="210" y="318" width="150" height="125" fill="#cd834a"/><text x="285" y="366" font-size="18" text-anchor="middle">表层</text><text x="285" y="402" font-size="24" text-anchor="middle">100%</text><rect x="380" y="318" width="600" height="125" fill="#e8eeeb" stroke="#9bacac"/><rect x="380" y="343.00" width="600" height="100.00" fill="#acd7d5"/><text x="680" y="366" font-size="18" text-anchor="middle">内部</text><text x="680" y="402" font-size="24" text-anchor="middle">80.0%</text><text x="210" y="481" font-size="19">整体平均 = 20% × 100% + 80% × 80.0% = 84.0%</text><text x="38" y="565" font-size="17">面积表示各区容量，填色高度表示占用率。两行分别画到自己的表层达到100%的时刻。</text><text x="38" y="598" font-size="16" fill="#61747c">这不是电池实测，也不把“表层100%”当通用析锂阈值；实际反应还受电位、成核与相变等影响。</text></g></svg>